name: Test Automation Framework

on:
  schedule:
    - cron: '00 18 * * *'
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run tests
        run: mvn test -X -Dbrowser=chrome -DisLambdaTest=true -DisHeadless=false

      - name: Upload Test Logs
        if: always()  # This ensures logs are saved even if the tests fail
        uses: actions/upload-artifact@v4.4.3
        with:
          name: test-logs
          path: logs/
          
      - name: Upload Screenshots
        if: always()  # This ensures logs are saved even if the tests fail
        uses: actions/upload-artifact@v4.4.3
        with:
          name: screenshots
          path: screenshots/

      - name: Archive Extent Reports
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: extent-reports
          path: reports/

      - name: Notify test success or failure
        run: echo "Tests completed."

      - name: Copy Report to gh-pages Folder
        if: always()
        run: |
          mkdir -p public/extent-reports
          cp -R report.html public/extent-reports/
          cp -R screenshots/ public/extent-reports/screenshots/
          ls -l

      - name: Deploy 🚀
        if: always()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public/extent-reports/
          token: ${{ secrets.AUTOMATION }}
          clean: true
